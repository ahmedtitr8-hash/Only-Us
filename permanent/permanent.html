<!-- خطوة ٣أ: إعداد الغرفة الدائمة أول مرة (إنشاء رمز يختاره المستخدم بنفسه، أو
     إدخال رمز موجود أرسله الشريك) -->
<div class="entry-step hidden" id="entry-step-permanent-setup">
  <button class="back-btn" id="back-from-permanent-setup" title="رجوع">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div id="permanent-setup-choice">
    <p class="entry-sub">غرفتكم الدائمة — رمز واحد تختارونه أنتم ويضل لكم للأبد، ما يحتاج تسوون غرفة جديدة كل مرة. اسمك يتحفظ مرة وحدة بس وما نطلبه منك مرة ثانية</p>
    <div class="field">
      <label for="name-input-permanent-setup">اسمك</label>
      <input id="name-input-permanent-setup" type="text" placeholder="اكتب اسمك" maxlength="20" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore />
    </div>
    <div class="field">
      <label for="permanent-code-create-input">اختر رمزكم الدائم (٤ أرقام)</label>
      <input id="permanent-code-create-input" type="text" inputmode="numeric" maxlength="4" placeholder="مثلًا: ٢٥٨٠" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore />
    </div>
    <button id="permanent-create-btn" class="primary-btn full-width">إنشاء الغرفة الدائمة</button>
    <div class="divider"><span>أو</span></div>
    <div class="field">
      <label for="permanent-code-input">عندك رمز أرسله شريكك؟</label>
      <input id="permanent-code-input" type="text" inputmode="numeric" maxlength="4" placeholder="اكتب الرمز هنا" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore />
    </div>
    <button id="permanent-enter-btn" class="secondary-btn full-width">دخول بالرمز</button>
    <p class="entry-error hidden" id="entry-error-permanent-setup"></p>
  </div>

  <div id="permanent-setup-created" class="hidden">
    <p class="entry-sub">هذا رمزكم الدائم — أرسله لشريكك عشان يدخل فيه مرة وحدة بس</p>
    <div class="permanent-code-display" id="permanent-code-display"></div>
    <button id="permanent-copy-btn" class="secondary-btn full-width">نسخ الرمز</button>
    <button id="permanent-continue-btn" class="primary-btn full-width">تمام، متابعة</button>
  </div>
</div>

<!-- خطوة ٣ب: اختيار النشاط بالغرفة الدائمة (تظهر كل مرة، بدون استثناء - وبرضو
     هي اللي ترجعنا لها زر "تبديل الفئة" جوا الغرفة، بدل ما نطلع للصفحة الرئيسية) -->
<div class="entry-step hidden" id="entry-step-permanent-mode">
  <button class="back-btn" id="back-from-permanent-mode" title="رجوع">
    <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <p class="entry-sub" id="permanent-mode-greeting">وش نسوي بغرفتنا الدائمة؟</p>
  <div class="mode-grid">
    <button class="mode-card" data-permanent-mode="watch">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3.2l4.1-2.8a.9.9 0 0 1 1.4.75v9.7a.9.9 0 0 1-1.4.75L17 14.8V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span>نتابع؟</span>
    </button>
    <button class="mode-card" data-permanent-mode="games">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="11" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M8 10.5v4M6 12.5h4M15.5 11h.01M17.5 13h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>نلعب؟</span>
    </button>
  </div>
  <button type="button" id="permanent-reference-btn" class="reference-link">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 0 4 5.5v14Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    <span>مرجع</span>
  </button>
</div>
