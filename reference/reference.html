<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>مرجع · onlyUs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reference.css" />
</head>
<body>

  <header class="ref-topbar">
    <a href="../index.html" class="ref-back" title="رجوع لـ onlyUs">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="ref-brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 0 4 5.5v14Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span>مرجع</span>
    </div>
    <div class="ref-spacer"></div>
    <button id="ref-account-btn" class="ref-back" title="حسابي">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="ref-search-bar">
    <svg viewBox="0 0 24 24" fill="none" class="ref-search-icon"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="ref-search-input" type="text" placeholder="دور عن فيلم أو مسلسل..." autocomplete="off" />
    <button id="ref-search-clear" class="ref-search-clear hidden" title="مسح">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <nav class="ref-filters" id="ref-filters">
    <button class="ref-filter active" data-filter="trending">الأكثر رواجًا</button>
    <button class="ref-filter" data-filter="movie">أفلام</button>
    <button class="ref-filter" data-filter="tv">مسلسلات</button>
    <button class="ref-filter ref-account-filter hidden" data-filter="myfav">⭐ مفضلتي</button>
    <button class="ref-filter ref-account-filter hidden" data-filter="mywatched">✓ شاهدتها</button>
  </nav>

  <nav class="ref-filters ref-genre-filters hidden" id="ref-genre-filters"></nav>

  <main class="ref-main" id="ref-main">
    <div class="ref-grid" id="ref-grid"></div>

    <div class="ref-state hidden" id="ref-loading">
      <span class="spinner"></span>
      <span>جارِ التحميل...</span>
    </div>

    <div class="ref-loading-more hidden" id="ref-loading-more">
      <span class="spinner"></span>
      <span>المزيد...</span>
    </div>

    <div id="ref-sentinel"></div>

    <div class="ref-state hidden" id="ref-empty">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.4"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>مافي نتائج</span>
    </div>

    <div class="ref-state hidden" id="ref-error">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01M10.3 3.9 2.5 17.5a1.6 1.6 0 0 0 1.4 2.5h16.2a1.6 1.6 0 0 0 1.4-2.5L13.7 3.9a1.6 1.6 0 0 0-2.8 0Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <span id="ref-error-text">صار خطأ بجلب البيانات</span>
    </div>
  </main>

  <!-- شاشة تفاصيل الفيلم/المسلسل -->
  <div class="ref-detail hidden" id="ref-detail">
    <div class="ref-detail-scroll">
      <div class="ref-detail-hero" id="ref-detail-hero">
        <button class="ref-detail-close" id="ref-detail-close" title="رجوع">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="ref-detail-body">
        <div class="ref-detail-poster-row">
          <img id="ref-detail-poster" class="ref-detail-poster" alt="" />
          <div class="ref-detail-headings">
            <h1 id="ref-detail-title"></h1>
            <div class="ref-detail-meta" id="ref-detail-meta"></div>
          </div>
        </div>

        <div class="ref-detail-genres" id="ref-detail-genres"></div>

        <div class="ref-account-actions" id="ref-account-actions">
          <button type="button" class="ref-account-action-btn" id="ref-fav-btn">
            <span class="star">⭐</span><span>أضف للمفضلة</span>
          </button>
          <button type="button" class="ref-account-action-btn" id="ref-watched-btn">
            <span class="check">✓</span><span>شاهدتها</span>
          </button>
        </div>

        <p class="ref-detail-overview" id="ref-detail-overview"></p>

        <div class="ref-xtream-box" id="ref-source-box">
          <div class="ref-xtream-head">
            <span>مصادر المشاهدة</span>
          </div>
          <div class="ref-xtream-season-dropdown" id="ref-source-dropdown">
            <button type="button" class="ref-xtream-season-btn" id="ref-source-btn">
              <span id="ref-source-btn-label">qimyclient</span>
              <svg viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="ref-xtream-season-menu hidden" id="ref-source-menu">
              <button type="button" class="ref-xtream-season-option active" data-source="xtream">qimyclient</button>
              <button type="button" class="ref-xtream-season-option" data-source="embed">مصدر إضافي (ترجمة عربية)</button>
            </div>
          </div>

          <div id="ref-panel-xtream">
            <div class="ref-xtream-status hidden" id="ref-xtream-status"></div>
            <div class="ref-xtream-results hidden" id="ref-xtream-results"></div>
          </div>

          <div id="ref-panel-embed" class="hidden">
            <div class="ref-embed-season-box hidden" id="ref-embed-season-box"></div>
            <div class="ref-xtream-status hidden" id="ref-embed-status"></div>
            <div class="ref-xtream-results hidden" id="ref-embed-results"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- مودال الحساب (رمز الـ4 أرقام) -->
  <div class="ref-modal-overlay hidden" id="ref-account-modal">
    <div class="ref-modal">
      <div class="ref-modal-title" id="ref-account-modal-title">ادخل رمزك المكوّن من 4 أرقام</div>
      <p class="ref-modal-hint">أول مرة تكتب فيها رمز، ينسجل كحساب جديد. بعدها اكتب نفس الرمز من أي جهاز عشان ترجع لمفضلتك.</p>
      <input id="ref-account-code-input" type="text" inputmode="numeric" maxlength="4" placeholder="----" autocomplete="off" />
      <p class="ref-modal-error hidden" id="ref-account-modal-error"></p>
      <div class="ref-modal-actions">
        <button type="button" class="ref-modal-btn secondary" id="ref-account-modal-cancel">إلغاء</button>
        <button type="button" class="ref-modal-btn primary" id="ref-account-modal-confirm">دخول</button>
      </div>
      <button type="button" class="ref-modal-logout hidden" id="ref-account-modal-logout">تسجيل خروج من هذا الجهاز</button>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="reference.js"></script>
</body>
</html>
