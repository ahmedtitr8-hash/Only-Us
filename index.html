<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<title>onlyUs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="core/style.css" />
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="entry-screen" class="screen">
    <div class="entry-card">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3.2l4.1-2.8a.9.9 0 0 1 1.4.75v9.7a.9.9 0 0 1-1.4.75L17 14.8V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </div>
      <h1>onlyUs</h1>

      <!-- خطوة ١: اختيار النشاط -->
      <div class="entry-step" id="entry-step-mode">
        <p class="entry-sub">مؤنستي، ممكن تشاركيني وقتك؟</p>
        <div class="mode-grid">
          <button class="mode-card" data-mode="watch">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3.2l4.1-2.8a.9.9 0 0 1 1.4.75v9.7a.9.9 0 0 1-1.4.75L17 14.8V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span>نتابع؟</span>
          </button>
          <button class="mode-card" data-mode="games">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="11" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M8 10.5v4M6 12.5h4M15.5 11h.01M17.5 13h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>نلعب؟</span>
          </button>
        </div>
        <div class="divider"><span>أو</span></div>
        <button id="show-join-btn" class="secondary-btn full-width">دخول لغرفة برمز</button>
        <button type="button" id="permanent-room-btn" class="secondary-btn full-width">غرفتنا الدائمة 💕</button>
        <button type="button" id="reference-link-btn" class="reference-link">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 0 4 5.5v14Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>مرجع</span>
        </button>
      </div>

      <!-- خطوة ٢أ: إنشاء غرفة (بعد اختيار نشاط) -->
      <div class="entry-step hidden" id="entry-step-create">
        <button class="back-btn" id="back-from-create" title="رجوع">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="field">
          <label for="name-input-create">اسمك</label>
          <input id="name-input-create" type="text" placeholder="اكتب اسمك" maxlength="20" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore />
        </div>
        <button id="confirm-create-btn" class="primary-btn">
          <span id="confirm-create-text">إنشاء الغرفة</span>
          <span class="spinner hidden" id="create-spinner"></span>
        </button>
      </div>

      <!-- خطوة ٢ب: دخول برمز -->
      <div class="entry-step hidden" id="entry-step-join">
        <button class="back-btn" id="back-from-join" title="رجوع">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="field">
          <label for="name-input-join">اسمك</label>
          <input id="name-input-join" type="text" placeholder="اكتب اسمك" maxlength="20" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore />
        </div>
        <div class="field">
          <label for="room-code-input">رمز الغرفة</label>
          <input id="room-code-input" type="text" inputmode="numeric" maxlength="8" placeholder="رمز الغرفة" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore />
        </div>
        <button id="join-room-btn" class="primary-btn">
          <span id="join-room-text">حيّاك</span>
          <span class="spinner hidden" id="join-spinner"></span>
        </button>
        <p class="entry-error hidden" id="entry-error"></p>
      </div>

      <!-- خطوات الغرفة الدائمة (إعداد أول مرة + اختيار النشاط) تُحمّل من ملفها
           المستقل permanent/permanent.html وقت التشغيل، بنفس أسلوب نتابع/نلعب -->
      <div id="permanent-fragment-mount"></div>
    </div>
  </div>

  <!-- شاشة الغرفة -->
  <div id="room-screen" class="screen hidden">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3.2l4.1-2.8a.9.9 0 0 1 1.4.75v9.7a.9.9 0 0 1-1.4.75L17 14.8V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span id="room-mode-label">onlyUs</span>
      </div>
      <button id="copy-code-btn" class="icon-btn" title="نسخ رمز الغرفة">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 9V7a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-2M6 9h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" id="browse-ref-btn" class="icon-btn hidden" title="دور لنا فيلم أو مسلسل">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="change-video-btn" class="icon-btn" title="تغيير الفيديو">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5M20 20v-5h-5M4 9a8 8 0 0 1 14.5-4.5M20 15a8 8 0 0 1-14.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- يظهر بس داخل الغرفة الدائمة (permanent.js يتحكم بإظهاره) - يرجّع لقائمة
           فئات الغرفة الدائمة (نتابع/نلعب) بدون ما يودّي للصفحة الرئيسية العادية -->
      <button type="button" id="switch-category-btn" class="icon-btn hidden" title="تبديل الفئة">
        <svg viewBox="0 0 24 24" fill="none"><path d="M17 3v4a1 1 0 0 1-1 1H4M7 21v-4a1 1 0 0 1 1-1h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="m4 8 4-4M20 16l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="leave-room-btn" class="icon-btn icon-btn-danger" title="الخروج من الغرفة">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main class="main-layout" id="main-layout">

      <!-- لوحة المتابعة -->
      <section class="activity-panel video-section hidden" id="watch-panel">
        <div id="watch-fragment-mount"></div>
      </section>

      <!-- لوحة الألعاب -->
      <section class="activity-panel games-section hidden" id="games-panel">
        <div id="games-fragment-mount"></div>
      </section>

      <!-- المشاركون -->
      <section class="participants-row">
        <div class="participant-card" id="card-me">
          <span class="avatar" id="avatar-me">أ</span>
          <span class="participant-name" id="name-me-label">أنت</span>
          <button id="mic-btn" class="mic-toggle" title="تشغيل / إيقاف المايك">
            <svg class="icon-mic-on" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-mic-off hidden" viewBox="0 0 24 24" fill="none"><path d="M9 9V6a3 3 0 0 1 6 0v3M15 12v0a3 3 0 0 1-4.24 2.73M19 11a7 7 0 0 1-1.68 4.55M5 11a7 7 0 0 0 7 7m0 0v3M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="participant-card" id="card-peer">
          <span class="avatar avatar-empty" id="avatar-peer">؟</span>
          <span class="participant-name" id="name-peer-label">بانتظار الانضمام</span>
          <button type="button" class="mic-indicator" id="peer-mic-indicator" title="اضغط للتحكم بصوت الطرف الآخر">
            <svg class="icon-mic-on hidden" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-mic-off" viewBox="0 0 24 24" fill="none"><path d="M9 9V6a3 3 0 0 1 6 0v3M15 12v0a3 3 0 0 1-4.24 2.73M19 11a7 7 0 0 1-1.68 4.55M5 11a7 7 0 0 0 7 7m0 0v3M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="call-volume-group hidden" id="call-volume-group" title="مستوى صوت المكالمة (منفصل عن صوت الفيديو)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 9v6h4l5 4V5L9 9H5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M17 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="call-volume" type="range" min="0" max="100" value="100" />
          </div>
        </div>
      </section>

      <!-- المحادثة -->
      <section class="chat-section" id="chat-section">
        <div id="chat-messages">
          <div class="chat-empty" id="chat-empty"></div>
        </div>

        <div class="typing-indicator hidden" id="typing-indicator">
          <span class="typing-dots"><i></i><i></i><i></i></span>
          <span id="typing-text">يكتب الآن</span>
        </div>

        <div class="chat-input-bar">
          <input id="chat-input" type="text" placeholder="اكتب رسالة" maxlength="500" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore />
          <button id="send-chat-btn" class="icon-btn-round" title="إرسال">
            <svg viewBox="0 0 24 24" fill="none"><path d="M21 3 3 10.5l7 2.5 2 7L21 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </section>

    </main>

    <audio id="remote-audio" autoplay></audio>
  </div>

  <!-- فئة "مرجع" تنفتح هنا بنفس الصفحة (بدون أي تنقّل) عشان اتصال الغرفة (الصوت
       وكل شيء) يضل شغال طول الوقت -->
  <div id="reference-view" class="screen hidden">
    <div id="reference-fragment-mount"></div>
  </div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<!-- المشروع مقسّم لملفات مستقلة عشان يسهل تتبع كل قسم وتعديله لحاله:
     core.js      = الاتصال والجلسة والدخول والمشاركين والمايك والشات (مشترك بين كل الأوضاع)
     watch.js     = كل شيء خاص بمشغل الفيديو ومزامنته (وضع "نتابع" بس)
     games.js     = كل الألعاب (وضع "نلعب" بس)
     permanent.js = الغرفة الدائمة بالكامل (رمزها الثابت، إعدادها أول مرة، اختيار
                    فئتها، والتنقّل بين فئاتها) - كود مستقل تمامًا عن الدخول
                    العادي/الغرف المؤقتة عشان ما يصير تلخبط بينهم
     reference.js = فئة "مرجع" (دور فيلم/مسلسل)، تتحمّل بس أول مرة تنفتح
     الترتيب مهم: core.js أول شي لأن البقية يعتمدون على دواله (sendData, isHost...). -->
<script src="core/core.js"></script>
<script>
  // نحمّل واجهة "نتابع" و"نلعب" والغرفة الدائمة من ملفاتهم المستقلة بمجلداتهم وقت
  // التشغيل، عشان index.html يفضل يحتوي هيكل الصفحة المشترك بس بدون أكواد خاصة بأي فئة.
  Promise.all([
    fetch('watch/watch.html').then((r) => r.text()),
    fetch('games/games.html').then((r) => r.text()),
    fetch('permanent/permanent.html').then((r) => r.text()),
  ]).then(([watchHtml, gamesHtml, permanentHtml]) => {
    document.getElementById('watch-fragment-mount').innerHTML = watchHtml;
    document.getElementById('games-fragment-mount').innerHTML = gamesHtml;
    document.getElementById('permanent-fragment-mount').innerHTML = permanentHtml;
    const s1 = document.createElement('script'); s1.src = 'watch/watch.js';
    s1.onload = () => {
      const s2 = document.createElement('script'); s2.src = 'games/games.js';
      document.body.appendChild(s2);
    };
    document.body.appendChild(s1);
    // permanent.js مستقل تمامًا عن watch.js/games.js (يعتمد بس على core.js اللي
    // محمّل أصلًا فوق)، فنحمّله بالتوازي بدون ما ننتظر سلسلة watch/games
    const s3 = document.createElement('script'); s3.src = 'permanent/permanent.js';
    document.body.appendChild(s3);
  });

  // ================= فئة "مرجع": تُفتح كطبقة فوق نفس الصفحة، بدون أي تنقّل =================
  // السبب: فتحها كرابط عادي كان يقفل اتصال الغرفة (PeerJS/الصوت) كامل، فيحس الطرف
  // الثاني إن الاتصال انقطع. الحل: نجيب محتواها ونعرضه بنفس الصفحة (زي "نتابع"
  // و"نلعب" بالضبط)، فاتصال core.js أبدًا ما ينلمس. نحمّلها أول مرة بس (كسولة، مو
  // من البداية) عشان الصفحة الرئيسية تفتح بسرعة لمن ما يحتاجها.
  let referenceLoaded = false;
  let referenceOpenedFrom = null; // 'entry' | 'room'

  function openReferenceView() {
    const entryScreen = document.getElementById('entry-screen');
    const roomScreen = document.getElementById('room-screen');
    const referenceView = document.getElementById('reference-view');
    referenceOpenedFrom = roomScreen.classList.contains('hidden') ? 'entry' : 'room';
    entryScreen.classList.add('hidden');
    roomScreen.classList.add('hidden');
    referenceView.classList.remove('hidden');

    if (referenceLoaded) return;
    referenceLoaded = true;
    Promise.all([
      fetch('reference/reference.html').then((r) => r.text()),
      fetch('reference/reference.css').then((r) => r.text()),
    ]).then(([refHtml, refCss]) => {
      const doc = new DOMParser().parseFromString(refHtml, 'text/html');
      const root = doc.getElementById('reference-root');
      document.getElementById('reference-fragment-mount').innerHTML = root ? root.innerHTML : refHtml;
      const styleTag = document.createElement('style');
      styleTag.textContent = refCss;
      document.head.appendChild(styleTag);
      const s = document.createElement('script');
      s.src = 'reference/reference.js';
      document.body.appendChild(s);
    });
  }

  function closeReferenceView() {
    document.getElementById('reference-view').classList.add('hidden');
    if (referenceOpenedFrom === 'room') document.getElementById('room-screen').classList.remove('hidden');
    else document.getElementById('entry-screen').classList.remove('hidden');
  }

  document.getElementById('reference-link-btn').addEventListener('click', openReferenceView);
  document.getElementById('browse-ref-btn').addEventListener('click', openReferenceView);
</script>
</body>
</html>
