<!-- ============================================================
     wird.html — فئة "وِرد" (طبقة مستقلة، بدون غرفة/اتصال حي)
     حساب برمز ٤ أرقام (نفس حساب "مرجع" بالضبط). المحتوى حي بالكامل من
     islamic.app API: أذكار حصن المسلم + قرآن كامل (بنظام صفحات مصحف حقيقي
     يمين/يسار) + خطة ختمة مع وِرد يومي.

     ملاحظة بنائية: index.html يسحب innerHTML الخاص بـ#wird-root فقط
     ويغرسه داخل #wird-fragment-mount (فيضيع الـwrapper نفسه). لذا كل
     تنسيقات الهوية البصرية (المتغيرات اللونية، الخط) معرّفة على
     #wird-scope كأول عنصر فعلي جوه wird-root، مو على wird-root نفسه.
     ============================================================ -->

<div id="wird-root">
<div id="wird-scope">

  <header class="wird-topbar">
    <button type="button" id="wird-back-btn" class="wird-back" title="رجوع لـ onlyUs">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="wird-brand">
      <span class="wird-brand-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.5c-1.6 2.2-2.6 4-2.6 5.9a2.6 2.6 0 1 0 5.2 0c0-1.9-1-3.7-2.6-5.9Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M4.5 20.5c1-4.6 4-7 7.5-7s6.5 2.4 7.5 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M12 13.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </span>
      <span class="wird-brand-text">وِرد</span>
    </div>
    <div class="wird-spacer"></div>
    <button type="button" id="wird-account-btn" class="wird-back" title="حسابي">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="wird-rule" aria-hidden="true">
    <span></span>
    <svg viewBox="0 0 24 24" class="wird-rule-star"><path d="M12 1.5l1.9 5.6 5.9.3-4.7 3.7 1.8 5.7L12 13.6 7.1 16.8l1.8-5.7-4.7-3.7 5.9-.3Z" fill="currentColor"/></svg>
    <span></span>
  </div>

  <!-- ============ الرئيسية: اختيار الفئة ============ -->
  <main class="wird-main" id="wird-home">
    <p class="wird-bismillah amiri">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
    <button type="button" class="wird-home-card" id="wird-home-azkar">
      <span class="wird-home-card-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 3c-3 3-5 6-5 9a5 5 0 0 0 10 0c0-3-2-6-5-9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </span>
      <span class="wird-home-card-title">الأذكار</span>
      <span class="wird-home-card-sub">صباح، مساء، ونوم</span>
    </button>
    <button type="button" class="wird-home-card" id="wird-home-quran">
      <span class="wird-home-card-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 0 4 5.5v14Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </span>
      <span class="wird-home-card-title">القرآن</span>
      <span class="wird-home-card-sub">قراءة حرة، وورد الختمة</span>
    </button>
  </main>

  <!-- ============ قسم الأذكار ============ -->
  <main class="wird-main hidden" id="wird-azkar-section">
    <div class="wird-subnav">
      <button type="button" class="wird-subnav-home" data-wird-home-btn>
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>الرئيسية</span>
      </button>
      <nav class="wird-subnav-tabs" id="wird-tabs">
        <button type="button" class="wird-tab active" data-wird-section="morning">الصباح</button>
        <button type="button" class="wird-tab" data-wird-section="evening">المساء</button>
        <button type="button" class="wird-tab" data-wird-section="sleep">النوم</button>
      </nav>
    </div>

    <div class="wird-version-toggle" id="wird-version-toggle">
      <button type="button" class="wird-version-btn active" data-wird-version="short">مختصر</button>
      <button type="button" class="wird-version-btn" data-wird-version="full">كامل</button>
    </div>

    <!-- بطاقة الذكر الواحد (إطار محدد، مو كامل الشاشة) -->
    <div class="wird-dhikr-frame" id="wird-dhikr-frame">
      <div class="wird-dhikr-crest" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2.5c-1.6 2.2-2.6 4-2.6 5.9a2.6 2.6 0 1 0 5.2 0c0-1.9-1-3.7-2.6-5.9Z"/></svg>
      </div>
      <div class="wird-dhikr-pos" id="wird-dhikr-pos">- / -</div>
      <div class="wird-dhikr-body" id="wird-dhikr-body">
        <p class="wird-status">جاري التحميل...</p>
      </div>
      <div class="wird-dhikr-controls">
        <button type="button" class="wird-dhikr-nav" id="wird-dhikr-prev" title="السابق">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="wird-dhikr-counter" id="wird-dhikr-counter" title="اضغط لعدّ مرات الذكر">
          <span class="wird-dhikr-counter-ring" aria-hidden="true"></span>
          <span id="wird-dhikr-count">٠</span>
          <small>تكرار</small>
        </button>
        <button type="button" class="wird-dhikr-nav" id="wird-dhikr-next" title="التالي">
          <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- ============ قسم القرآن ============ -->
  <main class="wird-main hidden" id="wird-quran-section">
    <div class="wird-subnav">
      <button type="button" class="wird-subnav-home" data-wird-home-btn>
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>الرئيسية</span>
      </button>
      <nav class="wird-subnav-tabs" id="wird-quran-tabs">
        <button type="button" class="wird-tab active" data-wird-quran-tab="daily">ورد الختمة</button>
        <button type="button" class="wird-tab" data-wird-quran-tab="free">قراءة حرة</button>
      </nav>
    </div>

    <!-- ---- ورد الختمة اليومي ---- -->
    <div id="wird-daily-panel">
      <p class="wird-status" id="wird-daily-status">...</p>

      <!-- نموذج إنشاء ختمة جديدة -->
      <div id="wird-plan-form" class="wird-card wird-plan-form hidden">
        <p class="wird-plan-label">قسّم الختمة بـ</p>
        <div class="wird-choice-row" id="wird-plan-unit-row">
          <button type="button" class="wird-choice-btn active" data-unit="page">صفحات</button>
          <button type="button" class="wird-choice-btn" data-unit="hizb">أحزاب</button>
          <button type="button" class="wird-choice-btn" data-unit="juz">أجزاء</button>
        </div>
        <p class="wird-plan-label">حدّد الخطة بـ</p>
        <div class="wird-choice-row" id="wird-plan-method-row">
          <button type="button" class="wird-choice-btn active" data-method="days">عدد الأيام</button>
          <button type="button" class="wird-choice-btn" data-method="perday">مقدار يومي</button>
        </div>
        <div class="wird-plan-input-row">
          <input type="number" min="1" id="wird-plan-number-input" class="wird-plan-number-input" value="30" />
          <span id="wird-plan-number-label">يوم</span>
        </div>
        <p class="wird-plan-preview" id="wird-plan-preview"></p>
        <button type="button" class="wird-modal-btn primary wird-plan-submit" id="wird-plan-submit-btn">ابدأ الختمة</button>
      </div>

      <!-- بطاقة ورد اليوم (تظهر لو فيه خطة قائمة) -->
      <div id="wird-daily-card" class="wird-daily-card hidden">
        <div class="wird-card wird-daily-head">
          <div>
            <p class="wird-daily-range amiri" id="wird-daily-range">-</p>
            <p class="wird-daily-meta" id="wird-daily-meta">-</p>
          </div>
          <span class="wird-daily-backlog hidden" id="wird-daily-backlog">-</span>
        </div>

        <!-- عارض المصحف (صفحات حقيقية يمين/يسار) -->
        <div class="wird-mushaf">
          <div class="wird-mushaf-page">
            <div class="wird-mushaf-pagehead">
              <span id="wird-daily-surah-label">-</span>
              <span class="wird-mushaf-pagenum" id="wird-daily-pagenum">-</span>
            </div>
            <div class="wird-mushaf-body" id="wird-daily-verses">
              <p class="wird-status">...</p>
            </div>
          </div>
          <div class="wird-mushaf-nav">
            <button type="button" class="wird-mushaf-btn" id="wird-daily-prev">
              <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>السابقة</span>
            </button>
            <button type="button" class="wird-mushaf-btn" id="wird-daily-next">
              <span>التالية</span>
              <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <button type="button" class="wird-modal-btn primary wird-daily-done-btn" id="wird-daily-done-btn">قرأت وردي اليوم ✓</button>
        <button type="button" class="wird-plan-reset-link" id="wird-plan-reset-link">إعادة ضبط خطة الختمة</button>
      </div>
    </div>

    <!-- ---- قراءة حرة ---- -->
    <div id="wird-free-panel" class="hidden">
      <button type="button" class="wird-surah-picker-btn" id="wird-surah-picker-btn">
        <span id="wird-surah-picker-label">اختر سورة...</span>
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="wird-mushaf">
        <div class="wird-mushaf-page">
          <div class="wird-mushaf-pagehead">
            <span id="wird-free-surah-label">-</span>
            <span class="wird-mushaf-pagenum" id="wird-free-pagenum">-</span>
          </div>
          <div class="wird-mushaf-body" id="wird-free-verses">
            <p class="wird-status">اختر سورة عشان تبدأ القراءة</p>
          </div>
        </div>
        <div class="wird-mushaf-nav">
          <button type="button" class="wird-mushaf-btn" id="wird-free-prev">
            <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>السابقة</span>
          </button>
          <button type="button" class="wird-mushaf-btn" id="wird-free-next">
            <span>التالية</span>
            <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ ورقة اختيار السورة ============ -->
  <div class="wird-modal-overlay hidden" id="wird-surah-sheet">
    <div class="wird-modal wird-sheet">
      <div class="wird-modal-title">اختر سورة</div>
      <div class="wird-surah-list" id="wird-surah-list">
        <p class="wird-status">جاري التحميل...</p>
      </div>
      <button type="button" class="wird-modal-btn secondary" id="wird-surah-sheet-close">إغلاق</button>
    </div>
  </div>

  <!-- ============ مودال الحساب (نفس حساب "مرجع" بالضبط) ============ -->
  <div class="wird-modal-overlay hidden" id="wird-account-modal">
    <div class="wird-modal">
      <div class="wird-modal-title" id="wird-account-modal-title">...</div>
      <p class="wird-modal-hint">نفس رمز حسابك بـ"مرجع" (لو عندكم وحد) يشتغل هنا تلقائيًا</p>
      <div id="wird-account-code-input" class="editable-field" data-placeholder="----" role="textbox"></div>
      <p class="wird-modal-error hidden" id="wird-account-modal-error"></p>
      <div class="wird-modal-actions">
        <button type="button" class="wird-modal-btn secondary" id="wird-account-modal-cancel">إلغاء</button>
        <button type="button" class="wird-modal-btn primary" id="wird-account-modal-confirm">دخول</button>
      </div>
      <button type="button" class="wird-modal-logout hidden" id="wird-account-modal-logout">تسجيل خروج من هذا الجهاز</button>
    </div>
  </div>

</div>
</div>
