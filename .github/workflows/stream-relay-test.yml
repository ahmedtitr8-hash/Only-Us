name: stream-relay-test
# تجربة فقط: يشغّل وسيط + قناة https عامة، ويطبع رابط مشاهدة الفيديو في اللوج والملخص.
on:
  workflow_dispatch:
    inputs:
      movie_url:
        description: 'رابط الفيلم الأصلي (http)'
        required: true
        default: 'http://a.norzro.cfd/movie/8667593288/2505245402/795918.mkv'
      minutes:
        description: 'كم دقيقة يظل شغال'
        required: true
        default: '20'
      tunnel:
        description: 'نوع القناة'
        required: true
        type: choice
        default: cloudflared
        options:
          - cloudflared
          - localhost.run
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MOVIE_URL: ${{ github.event.inputs.movie_url }}
      MINUTES: ${{ github.event.inputs.minutes }}
      TUNNEL_KIND: ${{ github.event.inputs.tunnel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start relay
        run: |
          nohup node proxy/relay.mjs > relay.log 2>&1 &
          sleep 2
          curl -sf http://127.0.0.1:8787/ping && echo " relay ok"

      - name: Test upstream from runner (1 byte)
        run: |
          ENC=$(node -p "encodeURIComponent(process.env.MOVIE_URL)")
          curl -s -m 60 -D - -o /dev/null -H "Range: bytes=0-0" "http://127.0.0.1:8787/p?u=$ENC" | head -12 || true

      - name: Speed test (local relay, up to 25s)
        run: |
          ENC=$(node -p "encodeURIComponent(process.env.MOVIE_URL)")
          curl -s -m 25 -r 0-39999999 -o /dev/null \
            -w "LOCAL: %{size_download} bytes in %{time_total}s = %{speed_download} B/s\n" \
            "http://127.0.0.1:8787/p?u=$ENC" | tee -a speed.txt || true

      - name: Open public tunnel
        run: |
          TUNNEL=""
          if [ "$TUNNEL_KIND" = "cloudflared" ]; then
            curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x cloudflared
            nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8787 > tunnel.log 2>&1 &
            for i in $(seq 1 30); do
              TUNNEL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
              if [ -n "$TUNNEL" ]; then break; fi
              sleep 2
            done
          else
            nohup ssh -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes \
              -R 80:127.0.0.1:8787 nokey@localhost.run > tunnel.log 2>&1 &
            for i in $(seq 1 30); do
              # نتجاهل رابط لوحة الإدارة (admin.localhost.run) ونأخذ رابط القناة الفعلي
              TUNNEL=$(grep -oE 'https://[a-zA-Z0-9-]+\.lhr\.life' tunnel.log | head -1 || true)
              if [ -z "$TUNNEL" ]; then
                TUNNEL=$(grep -oE 'https://[a-zA-Z0-9-]+\.localhost\.run' tunnel.log | grep -v '^https://admin\.' | head -1 || true)
              fi
              if [ -n "$TUNNEL" ]; then break; fi
              sleep 2
            done
          fi
          if [ -z "$TUNNEL" ]; then echo "لم تنفتح القناة:"; cat tunnel.log; exit 1; fi
          echo "TUNNEL=$TUNNEL" >> "$GITHUB_ENV"

      - name: Speed test (through tunnel, up to 25s)
        run: |
          sleep 5
          ENC=$(node -p "encodeURIComponent(process.env.MOVIE_URL)")
          curl -s -m 25 -r 0-39999999 -o /dev/null \
            -w "TUNNEL($TUNNEL_KIND): %{size_download} bytes in %{time_total}s = %{speed_download} B/s\n" \
            "$TUNNEL/p?u=$ENC" | tee -a speed.txt || true

      - name: Print watch link
        run: |
          ENC=$(node -p "encodeURIComponent(process.env.MOVIE_URL)")
          LINK="$TUNNEL/watch?u=$ENC"
          echo "رابط المشاهدة: $LINK"
          {
            echo "### رابط المشاهدة (يظل شغال $MINUTES دقيقة)"
            echo ""
            echo "$LINK"
            echo ""
            echo "#### قياس السرعة (بايت/ثانية، 25 ثانية)"
            echo '```'
            cat speed.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep alive
        run: |
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            curl -s -m 10 -o /dev/null -w "tunnel ping: %{http_code}\n" "$TUNNEL/ping" || echo "tunnel ping failed"
            tail -n 3 relay.log
            sleep 60
          done

      - name: Relay log
        if: always()
        run: cat relay.log || true
